services:
  postgres:
    image: docker.io/library/postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Named volume for actual DB cluster storage
      - pgdata:/var/lib/postgresql
      # Bind mount for CSV imports with SELinux shared label
      - ./imports:/imports:z,U

volumes:
  pgdata:
